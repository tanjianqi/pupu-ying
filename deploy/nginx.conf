# 扑扑鹰 Nginx 反向代理配置示例
# @module deploy/nginx.conf
# @职责 将 80/443 端口的请求转发到 PM2 管理的 node 进程（127.0.0.1:4321）
# @使用 复制到 /etc/nginx/sites-available/pupu-ying.conf，创建软链到 sites-enabled
#       nginx -t 测试配置，systemctl reload nginx 重载
# @版本 v1.3.0

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name www.ppypaper.com ppypaper.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name www.ppypaper.com ppypaper.com;

    # SSL 证书（按实际路径修改）
    ssl_certificate     /etc/letsencrypt/live/www.ppypaper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ppypaper.com/privkey.pem;

    # SSL 优化
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 日志
    access_log /var/log/nginx/pupu-ying.access.log;
    error_log  /var/log/nginx/pupu-ying.error.log;

    # 静态资源直接服务（Astro 构建产物）
    # 客户端资源在 dist/client/，由 node 服务器托管，无需单独配置

    # 反向代理到 PM2 管理的 node 进程
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 上传/响应超时（联系表单提交邮件发送可能较慢）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态资源缓存（Astro 构建的 _astro/ 目录带 hash，可长缓存）
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
