# 扑扑鹰 CD：main 分支 push 自动部署到生产服务器
# @触发 push 到 main 分支
# @职责 SSH 登录 → 拉取最新代码 → 重启 PM2 → 健康检查
# @依赖 GitHub Secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
        env:
          SMTP_HOST: smtp.exmail.qq.com
          SMTP_PORT: 465

      - name: 同步构建产物到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'dist/,package.json,ecosystem.config.cjs,deploy/,.env.example'
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: 远程执行部署脚本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            bash deploy/remote-deploy.sh

      - name: 健康检查
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DEPLOY_HOST }}/api/rank?keyword=ping || echo "000")
            echo "尝试 $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then
              echo "部署成功，服务正常响应"
              exit 0
            fi
            sleep 3
          done
          echo "部署后健康检查失败"
          exit 1
